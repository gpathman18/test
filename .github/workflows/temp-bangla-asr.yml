name: Temporary Whisper Large v3 Turbo

on:
  pull_request:
    paths:
      - 'temp-trigger.txt'
      - '.github/workflows/temp-bangla-asr.yml'
  workflow_dispatch:

jobs:
  package-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download and split multilingual model
        run: |
          set -euxo pipefail
          mkdir -p bundle/parts
          curl -L --fail --retry 5 --retry-delay 3 \
            -o bundle/ggml-large-v3-turbo-q5_0.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
          split -b 300M -d -a 2 bundle/ggml-large-v3-turbo-q5_0.bin bundle/parts/model.part.
          ls -lh bundle/ggml-large-v3-turbo-q5_0.bin bundle/parts

      - name: Upload model part 00
        uses: actions/upload-artifact@v4
        with:
          name: whisper-turbo-q5-00
          path: bundle/parts/model.part.00
          retention-days: 1
          compression-level: 0

      - name: Upload model part 01
        if: ${{ hashFiles('bundle/parts/model.part.01') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: whisper-turbo-q5-01
          path: bundle/parts/model.part.01
          retention-days: 1
          compression-level: 0

      - name: Upload model part 02
        if: ${{ hashFiles('bundle/parts/model.part.02') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: whisper-turbo-q5-02
          path: bundle/parts/model.part.02
          retention-days: 1
          compression-level: 0
