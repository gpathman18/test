name: Temporary Public Reel Audio Check

on:
  pull_request:
    paths:
      - 'temp-trigger.txt'
      - '.github/workflows/temp-bangla-asr.yml'
  workflow_dispatch:

jobs:
  fetch-public-reel:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch public oEmbed metadata
        run: |
          set -euxo pipefail
          mkdir -p bundle
          curl -L --fail --retry 3 \
            --get 'https://graph.facebook.com/v25.0/oembed_video' \
            --data-urlencode 'url=https://www.facebook.com/reel/1897613127856000/' \
            -o bundle/oembed.json || true
          cat bundle/oembed.json || true

      - name: Try public Reel audio extraction
        run: |
          set -euxo pipefail
          python -m pip install --quiet yt-dlp
          yt-dlp --no-playlist \
            -f 'bestaudio/best' \
            -o 'bundle/original_reel.%(ext)s' \
            'https://www.facebook.com/reel/1897613127856000/' || true
          find bundle -maxdepth 1 -type f -printf '%f %s bytes\n'

      - name: Upload public results
        uses: actions/upload-artifact@v4
        with:
          name: public-reel-audio-check
          path: bundle/
          retention-days: 1
          compression-level: 6
