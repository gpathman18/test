name: Temporary Bangla ASR Model

on:
  pull_request:
    paths:
      - 'temp-trigger.txt'
      - '.github/workflows/temp-bangla-asr.yml'
  workflow_dispatch:

jobs:
  download-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download Bengali-specific GGML model
        run: |
          set -euxo pipefail
          mkdir -p bundle
          python -m pip install --quiet huggingface_hub
          python - <<'PY'
          from huggingface_hub import hf_hub_download
          import shutil
          src = hf_hub_download(
              repo_id='afridee/banglaasr-ggml',
              filename='ggml-banglaasr-small-q5_0.bin',
          )
          shutil.copy2(src, 'bundle/ggml-banglaasr-small-q5_0.bin')
          PY
          ls -lh bundle/ggml-banglaasr-small-q5_0.bin

      - name: Upload model bundle
        uses: actions/upload-artifact@v4
        with:
          name: bangla-asr-q5
          path: bundle/ggml-banglaasr-small-q5_0.bin
          retention-days: 1
          compression-level: 0
