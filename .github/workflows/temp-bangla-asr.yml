name: Temporary Chunked Bengali Transcription

on:
  pull_request:
    paths:
      - 'temp-trigger.txt'
      - '.github/workflows/temp-bangla-asr.yml'
  workflow_dispatch:

jobs:
  transcribe-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Prepare tools
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential ffmpeg
          python -m pip install --quiet yt-dlp

      - name: Build whisper.cpp
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/ggml-org/whisper.cpp.git
          cmake -S whisper.cpp -B whisper.cpp/build \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF
          cmake --build whisper.cpp/build --config Release -j 4

      - name: Download and split public Reel audio
        run: |
          set -euxo pipefail
          mkdir -p work/chunks output/chunks
          yt-dlp --no-playlist -f 'bestaudio/best' \
            -o 'work/reel.%(ext)s' \
            'https://www.facebook.com/reel/1897613127856000/'
          ffmpeg -v error -i work/reel.* -ac 1 -ar 16000 -c:a pcm_s16le work/reel.wav -y
          ffmpeg -v error -i work/reel.wav -f segment -segment_time 8 \
            -reset_timestamps 1 -c:a pcm_s16le work/chunks/chunk_%02d.wav
          curl -L --fail --retry 5 --retry-delay 3 \
            -o work/ggml-large-v3-turbo-q5_0.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin
          ls -lh work/chunks work/ggml-large-v3-turbo-q5_0.bin

      - name: Transcribe Bengali chunks independently
        run: |
          set -euxo pipefail
          : > output/combined.txt
          for wav in work/chunks/chunk_*.wav; do
            base=$(basename "$wav" .wav)
            timeout 8m whisper.cpp/build/bin/whisper-cli \
              -m work/ggml-large-v3-turbo-q5_0.bin \
              -f "$wav" \
              -l bn -t 4 -bo 5 -bs 5 -nf -mc 0 -ml 120 \
              -otxt -of "output/chunks/$base" \
              > "output/chunks/$base.stdout.log" \
              2> "output/chunks/$base.stderr.log" || true
            printf '%s: ' "$base" >> output/combined.txt
            if [ -f "output/chunks/$base.txt" ]; then
              tr '\n' ' ' < "output/chunks/$base.txt" >> output/combined.txt
            else
              printf '[no transcript]' >> output/combined.txt
            fi
            printf '\n' >> output/combined.txt
          done
          cat output/combined.txt

      - name: Upload chunked result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-reel-chunked-bengali-result
          path: output/
          retention-days: 1
          compression-level: 6
